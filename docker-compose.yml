version: '3.8'

services:
  ucmec-moo-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ucmec-moo-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WORKER_CONCURRENCY=1
      - PYTHONUNBUFFERED=1
    volumes:
      - experiments_data:/app/experiments_storage
      - results_data:/app/results
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  experiments_data:
    driver: local
  results_data:
    driver: local
